<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Everest Prototype: structured treat-to-target visit capture for rheumatoid arthritis.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Everest Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky top bar, single column (max 760px), bottom score dock while recording a visit */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16202b; --muted:#5b6876; --line:#d9dfe5;
  --accent:#1f5f8b; --accent-soft:#e3edf5; --accent-ink:#ffffff;
  --tender:#c2621b; --tender-soft:#fbeadc; --swollen:#2a7f9e; --swollen-soft:#dcf0f6;
  --rem:#2e7d4f; --rem-soft:#e2f2e8; --lda:#6c8a1f; --lda-soft:#eef3dc;
  --mod:#b7791f; --mod-soft:#f8eed9; --high:#b23a3a; --high-soft:#f7e1e1;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --fig-bg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642;
  --accent:#6fb0de; --accent-soft:#1c3446; --accent-ink:#0b1620;
  --tender:#f0975a; --tender-soft:#3a2617; --swollen:#62c1e0; --swollen-soft:#15323d;
  --rem:#6fcf97; --rem-soft:#173024; --lda:#b5d35a; --lda-soft:#28301a;
  --mod:#e6b65c; --mod-soft:#33291a; --high:#ef8181; --high-soft:#3a1d1f; --fig-bg:#e9edf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642;
  --accent:#6fb0de; --accent-soft:#1c3446; --accent-ink:#0b1620;
  --tender:#f0975a; --tender-soft:#3a2617; --swollen:#62c1e0; --swollen-soft:#15323d;
  --rem:#6fcf97; --rem-soft:#173024; --lda:#b5d35a; --lda-soft:#28301a;
  --mod:#e6b65c; --mod-soft:#33291a; --high:#ef8181; --high-soft:#3a1d1f; --fig-bg:#e9edf1; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:760px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.banner{font-size:13px;padding:10px 12px;border-radius:var(--r);background:var(--mod-soft);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* patient list */
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--bg)}
.prow .code{font-family:var(--f-data);font-weight:600}
.prow .meta{grid-column:1;font-size:13px;color:var(--muted)}
.prow .right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.rem{background:var(--rem-soft);color:var(--rem)}
.pill.lda{background:var(--lda-soft);color:var(--lda)}
.pill.mod{background:var(--mod-soft);color:var(--mod)}
.pill.high{background:var(--high-soft);color:var(--high)}
.pill.none{background:var(--bg);color:var(--muted)}
.pill.met{background:var(--rem-soft);color:var(--rem)}
.pill.miss{background:var(--high-soft);color:var(--high)}
.pill.demo{background:var(--accent-soft);color:var(--accent)}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* NRS 0-10 */
.nrs{display:flex;flex-direction:column;gap:6px}
.nrs .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nrs .lab b{font-size:14px}
.nrs .val{font-family:var(--f-data);font-size:20px;font-weight:600}
.nrs input[type=range]{width:100%;accent-color:var(--accent)}
.nrs .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:none;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.steps button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;border:1px solid var(--line)}
.steps button[aria-current="step"]{color:var(--ink);background:var(--surface)}
.steps button[aria-current="step"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.done i{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}

/* joints */
.jtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;font-size:13px}
.mode button[data-m="t"][aria-pressed="true"]{background:var(--tender);color:#fff}
.mode button[data-m="s"][aria-pressed="true"]{background:var(--swollen);color:#fff}
.jcounts{display:flex;gap:14px;margin-left:auto;font-size:13px}
.jcounts b{font-family:var(--f-data);font-size:18px}
.jfig{display:grid;grid-template-columns:minmax(0,0.75fr) minmax(0,1.4fr);gap:12px;align-items:start}
@media (max-width:540px){.jfig{grid-template-columns:1fr}.jfig .figbox:first-child svg{max-height:420px}}
.figbox{margin:0;background:var(--fig-bg);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.figbox svg{width:100%;height:auto;display:block}
.figbox figcaption{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:0 4px;flex-wrap:wrap}
.fig-side{fill:var(--muted);font:700 28px var(--f-display)}
.jt{cursor:pointer;outline:none}
.jt circle.hit{fill:transparent}
.jt circle.base{fill:rgba(255,255,255,.55);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.jt circle.t{fill:none;stroke:var(--tender);stroke-width:3.5;vector-effect:non-scaling-stroke;opacity:0}
.jt circle.s{fill:var(--swollen);opacity:0}
.jt.is-t circle.t{opacity:1}
.jt.is-s circle.s{opacity:.85}
.jt.is-t circle.base,.jt.is-s circle.base{fill:#fff}
.jt:hover circle.base,.jt:focus-visible circle.base{stroke:var(--accent);stroke-width:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.score .n{font-family:var(--f-data);font-size:22px;font-weight:600}
.score .k{font-size:12px;color:var(--muted);font-weight:600}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dock .live{display:flex;gap:14px;align-items:center;margin-right:auto;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dock .live b{font-family:var(--f-data);font-size:16px;color:var(--ink)}

/* chart */
.chartwrap{overflow-x:auto}
.chart text{font:11px var(--f-data);fill:var(--muted)}
.chart .band-rem{fill:var(--rem-soft)} .chart .band-lda{fill:var(--lda-soft)} .chart .band-mod{fill:var(--mod-soft)} .chart .band-high{fill:var(--high-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}

table.recs{border-collapse:collapse;width:100%;font-size:13px}
table.recs th,table.recs td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.recs th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
table.recs td.n{font-family:var(--f-data);text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:60vh}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--bg)}
.vitem .d{font-weight:600}
.vitem .s{font-size:13px;color:var(--muted);grid-column:1}
.vitem .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 25 L11 9 L15 15 L19 7 L28 25 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="19" cy="7" r="2.4" fill="var(--accent)"/></svg>
    <div><b>Everest Prototype</b><small>RA treat-to-target visit capture</small></div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-patients" data-view="patients" aria-current="true">Patients</button>
    <button id="tab-records" data-view="records">Records</button>
  </nav>
</div></header>

<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
// ---------- Reference data ----------
const JOINTS = [
 // id, label, side
 ["SH","Shoulder"],["EL","Elbow"],["WR","Wrist"],
 ["MCP1","MCP 1"],["MCP2","MCP 2"],["MCP3","MCP 3"],["MCP4","MCP 4"],["MCP5","MCP 5"],
 ["PIP1","Thumb IP"],["PIP2","PIP 2"],["PIP3","PIP 3"],["PIP4","PIP 4"],["PIP5","PIP 5"],
 ["KN","Knee"]];
const ALL_JOINTS = []; JOINTS.forEach(([id,l])=>{ALL_JOINTS.push({id:"R_"+id,label:"Right "+l});ALL_JOINTS.push({id:"L_"+id,label:"Left "+l});});
const PRIORITIES = ["Less pain","Less fatigue","Keep working","Sleep better","Stay active / exercise","Family & caring","Fewer side effects","Avoid steroids","Fewer injections","Plan a pregnancy","Mental wellbeing","Hobbies & travel"];
const DECISIONS = ["Continue current treatment","Optimise dose","Add csDMARD","Switch / start b/tsDMARD","Taper (sustained target)","Steroid bridge","Refer (physio, OT, nurse)"];

// ---------- Scoring ----------
function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:null}
function scores(v){
  const t=v.tender.length, s=v.swollen.length, pg=n(v.ptGA), eg=n(v.evGA), crp=n(v.crp), esr=n(v.esr);
  const o={tjc:t,sjc:s};
  if(pg!=null&&crp!=null) o.das28crp=0.56*Math.sqrt(t)+0.28*Math.sqrt(s)+0.36*Math.log(crp+1)+0.014*pg*10+0.96;
  if(pg!=null&&esr!=null&&esr>0) o.das28esr=0.56*Math.sqrt(t)+0.28*Math.sqrt(s)+0.70*Math.log(esr)+0.014*pg*10;
  if(pg!=null&&eg!=null) o.cdai=t+s+pg+eg;
  if(o.cdai!=null&&crp!=null) o.sdai=o.cdai+crp/10;
  if(pg!=null&&crp!=null) o.boolean=(t<=1&&s<=1&&crp/10<=1&&pg<=2);
  return o;
}
function cat(kind,x){
  if(x==null) return null;
  const T={das28:[2.6,3.2,5.1],cdai:[2.8,10,22],sdai:[3.3,11,26]}[kind];
  if(kind==="das28") return x<T[0]?"rem":x<=T[1]?"lda":x<=T[2]?"mod":"high";
  return x<=T[0]?"rem":x<=T[1]?"lda":x<=T[2]?"mod":"high";
}
const CATNAME={rem:"Remission",lda:"Low activity",mod:"Moderate",high:"High",none:"Incomplete"};
function primary(sc){ // DAS28-CRP first, then CDAI
  if(sc.das28crp!=null) return {kind:"DAS28-CRP",val:sc.das28crp,cat:cat("das28",sc.das28crp)};
  if(sc.cdai!=null) return {kind:"CDAI",val:sc.cdai,cat:cat("cdai",sc.cdai)};
  if(sc.das28esr!=null) return {kind:"DAS28-ESR",val:sc.das28esr,cat:cat("das28",sc.das28esr)};
  return {kind:"—",val:null,cat:"none"};
}
function targetMet(target,c){ if(!c||c==="none") return null; return target==="lda"? (c==="rem"||c==="lda") : c==="rem"; }
const f1=x=>x==null?"—":x.toFixed(x>=10?1:2);

// ---------- State ----------
let db=null, downloads=null, live=false, canWrite=true;
let patients=[], visits=[];
let view={name:"patients"};
let draft=null, step=0, jmode="t";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
const today=()=>new Date().toISOString().slice(0,10);
function addMonths(d,m){const x=new Date(d+"T12:00:00");x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)}
const fmtDate=d=>d?new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"—";

let status="loading"; // loading | ready | offline | slow | local

function lsLoad(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({patients,visits}));return true}catch(e){return false}}
function setStatus(s){status=s;if(view.name!=="visit"&&view.name!=="newPatient")render()}

// ---------- Rendering ----------
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===(view.name==="records"?"records":"patients"))));
  const app=$("#app");
  $("#dock").hidden = view.name!=="visit";
  let h="";
  if(status==="local") h+=`<div class="banner">Standalone mode: records are saved in this browser on this device only. Use Records → Export to keep a copy. Do not enter identifiable patient information.</div>`;
  if(status==="offline") h+=`<div class="banner">Records can't be saved in this view. Open the page inside Claude while signed in to store visits. You can still try the form.</div>`;
  if(status==="slow") h+=`<div class="banner">Still connecting to the record store. Anything shown may be out of date.</div>`;
  if(live&&!canWrite) h+=`<div class="banner">You have view-only access. Ask the owner for Contributor access to record visits.</div>`;
  if(view.name==="patients") h+=renderPatients();
  else if(view.name==="patient") h+=renderPatient();
  else if(view.name==="newPatient") h+=renderNewPatient();
  else if(view.name==="visit") h+=renderVisit();
  else if(view.name==="records") h+=renderRecords();
  app.innerHTML=h;
  if(view.name==="visit") renderDock();
  bind();
}

function latestVisit(pid){return visits.filter(v=>v.patientId===pid).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]}

function renderPatients(){
  let h=`<div class="row spread"><div><div class="eyebrow">Caseload</div><h1 style="font-size:26px">Patients</h1></div>
  <button class="btn primary" data-act="newPatient" ${canWrite?"":"disabled"}>Add patient</button></div>`;
  if(status==="loading"&&!patients.length) return h+`<div class="empty">Loading records…</div>`;
  if(!patients.length) return h+`<div class="empty">No patients yet. Add a patient with a study code (no names), then record their first visit.</div>`;
  const sorted=[...patients].sort((a,b)=>(a.code||"").localeCompare(b.code||""));
  h+=`<div class="plist">`;
  for(const p of sorted){
    const lv=latestVisit(p.id); const pr=lv?primary(lv.scores||{}):null;
    const met=lv?targetMet(p.target,pr.cat):null;
    const due=lv&&lv.nextReview?lv.nextReview:null; const overdue=due&&due<today();
    h+=`<button class="prow" data-act="openPatient" data-id="${esc(p.id)}">
      <span><span class="code">${esc(p.code)}</span> ${p.demo?'<span class="pill demo">Example</span>':""}</span>
      <span class="meta">Target: ${p.target==="lda"?"Low disease activity":"Remission"} · ${lv?"Last seen "+fmtDate(lv.date):"No visits yet"}${due?` · Review ${overdue?"<b style='color:var(--high)'>overdue</b>":fmtDate(due)}`:""}</span>
      <span class="right">${lv?`<span class="pill ${pr.cat}">${CATNAME[pr.cat]} <span class="num">${f1(pr.val)}</span></span>`:`<span class="pill none">No score</span>`}
      ${met==null?"":`<span class="pill ${met?"met":"miss"}">${met?"At target":"Not at target"}</span>`}</span>
    </button>`;
  }
  return h+`</div><p class="note">Disease activity shows DAS28-CRP where CRP is recorded, otherwise CDAI. Patients are stored by study code only.</p>`;
}

function chartSVG(vs){
  const pts=vs.map(v=>({d:v.date,y:(v.scores||{}).das28crp})).filter(p=>p.y!=null);
  if(pts.length<1) return `<div class="empty" style="padding:16px">A DAS28-CRP trend appears once a visit has CRP and patient global recorded.</div>`;
  const W=640,H=200,L=34,R=12,T=10,B=26, ymax=Math.max(7,Math.ceil(Math.max(...pts.map(p=>p.y)))), ymin=0;
  const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const band=(a,b,c)=>`<rect class="band-${c}" x="${L}" width="${W-L-R}" y="${y(b)}" height="${y(a)-y(b)}"/>`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%" role="img" aria-label="DAS28-CRP over time">`;
  s+=band(0,2.6,"rem")+band(2.6,3.2,"lda")+band(3.2,5.1,"mod")+band(5.1,ymax,"high");
  [0,2.6,3.2,5.1,ymax].forEach(t=>s+=`<text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`);
  s+=`<path class="ln" d="${pts.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.y)).join(" ")}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="pt ${i===pts.length-1?"last":""}" cx="${x(i)}" cy="${y(p.y)}" r="4.5"/>`;
    if(pts.length<=8||i===0||i===pts.length-1) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${new Date(p.d+"T12:00:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"})}</text>`;});
  return s+`</svg>`;
}

function renderPatient(){
  const p=patients.find(x=>x.id===view.id); if(!p) return `<div class="empty">Patient not found.</div>`;
  const vs=visits.filter(v=>v.patientId===p.id).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let h=`<button class="btn ghost" data-act="home">← All patients</button>
  <div class="row spread"><div><div class="eyebrow">Patient</div><h1 class="num" style="font-size:26px">${esc(p.code)} ${p.demo?'<span class="pill demo" style="font-family:var(--f-body);vertical-align:middle">Example</span>':""}</h1>
  <div class="muted" style="font-size:13px">${[p.sex,p.yob?"born "+p.yob:"",p.dxYear?"diagnosed "+p.dxYear:"",p.rf?"RF "+p.rf:"",p.acpa?"ACPA "+p.acpa:""].filter(Boolean).map(esc).join(" · ")}</div></div>
  <button class="btn primary" data-act="newVisit" data-id="${esc(p.id)}" ${canWrite?"":"disabled"}>Record visit</button></div>
  <section class="panel"><div class="row spread"><h2 style="font-size:17px">DAS28-CRP over time</h2><span class="pill ${p.target==="lda"?"lda":"rem"}">Target: ${p.target==="lda"?"Low activity ≤3.2":"Remission <2.6"}</span></div>
  <div class="chartwrap">${chartSVG(vs)}</div></section>
  <section class="panel"><h2 style="font-size:17px">Visits</h2>`;
  if(!vs.length) h+=`<div class="empty" style="padding:16px">No visits recorded yet.</div>`;
  else{ h+=`<div class="vlist">`; [...vs].reverse().forEach(v=>{const pr=primary(v.scores||{}),met=targetMet(p.target,pr.cat);
    h+=`<div class="vitem"><span class="d">${fmtDate(v.date)} <span class="muted" style="font-weight:400">· ${esc(v.type||"")}</span></span>
    <span class="s">TJC28 <span class="num">${v.scores?.tjc??"—"}</span> · SJC28 <span class="num">${v.scores?.sjc??"—"}</span> · CDAI <span class="num">${f1(v.scores?.cdai)}</span> · ${esc(v.decision||"No decision recorded")}</span>
    <span class="r"><span class="pill ${pr.cat}">${pr.kind} <span class="num">${f1(pr.val)}</span></span>${met==null?"":`<span class="pill ${met?"met":"miss"}">${met?"At target":"Not at target"}</span>`}</span></div>`;});
    h+=`</div>`;}
  return h+`</section>`;
}

function renderNewPatient(){
  return `<button class="btn ghost" data-act="home">← All patients</button>
  <section class="panel"><div><div class="eyebrow">New patient</div><h1 style="font-size:22px">Baseline profile</h1></div>
  <p class="note">Use a study or clinic code, never a name or hospital number.</p>
  <div class="grid2">
    <label class="f">Study code<input id="np-code" type="text" placeholder="e.g. WFD-014" autocomplete="off"></label>
    <label class="f">Year of birth<input id="np-yob" type="number" min="1920" max="2010" placeholder="1968"></label>
    <label class="f">Sex<select id="np-sex"><option value="">—</option><option>Female</option><option>Male</option><option>Other</option></select></label>
    <label class="f">Year of RA diagnosis<input id="np-dx" type="number" min="1950" max="2026" placeholder="2019"></label>
    <label class="f">Rheumatoid factor<select id="np-rf"><option value="">Unknown</option><option>positive</option><option>negative</option></select></label>
    <label class="f">Anti-CCP (ACPA)<select id="np-acpa"><option value="">Unknown</option><option>positive</option><option>negative</option></select></label>
    <label class="f">Agreed treatment target<select id="np-target"><option value="rem">Remission</option><option value="lda">Low disease activity</option></select><span class="h">Agreed with the patient (shared decision)</span></label>
  </div>
  <div class="row"><button class="btn primary" data-act="savePatient">Save patient</button><button class="btn" data-act="home">Cancel</button></div></section>`;
}

function nrs(id,label,lo,hi,val){
  return `<div class="nrs"><div class="lab"><b>${label}</b><span class="val" id="${id}-v">${val==null||val===""?"–":val}</span></div>
  <input type="range" id="${id}" min="0" max="10" step="1" value="${val==null||val===""?5:val}" data-nrs="${id}" aria-label="${label}">
  <div class="ends"><span>0 · ${lo}</span><span>10 · ${hi}</span></div></div>`;
}

function jointMark(id,x,y,r){
  return `<g class="jt ${draft.tender.includes(id)?"is-t":""} ${draft.swollen.includes(id)?"is-s":""}" data-joint="${id}" tabindex="0" role="button" aria-label="${ALL_JOINTS.find(j=>j.id===id).label}">
  <circle class="hit" cx="${x}" cy="${y}" r="${r*1.6}"/><circle class="s" cx="${x}" cy="${y}" r="${r}"/><circle class="base" cx="${x}" cy="${y}" r="${r*0.62}"/><circle class="t" cx="${x}" cy="${y}" r="${r*1.12}"/></g>`;
}
function bodySVG(){
  const W=520,H=1305, ids=["SH","EL","WR","KN"];
  let m=""; for(const side of ["R","L"]) for(const j of ids){const [x,y]=BODY_PTS[side+"_"+j]; m+=jointMark(side+"_"+j,x*W,y*H,17);}
  return `<figure class="figbox"><svg viewBox="0 0 ${W} ${H}" aria-label="Body: shoulders, elbows, wrists, knees">
  <image href="${BODY_IMG}" x="0" y="0" width="${W}" height="${H}"/>
  <text class="fig-side" x="14" y="40">R</text><text class="fig-side" x="506" y="40" text-anchor="end">L</text>${m}</svg>
  <figcaption>Shoulders · elbows · wrists · knees</figcaption></figure>`;
}
function handSVG(){
  const W=900,H=639; let m="";
  for(const side of ["R","L"]) for(let d=1;d<=5;d++) for(const t of ["MCP","PIP"]){const id=`${side}_${t}${d}`;const [x,y]=HAND_PTS[id]; m+=jointMark(id,x*W,y*H,13);}
  return `<figure class="figbox"><svg viewBox="0 0 ${W} ${H}" aria-label="Backs of both hands: MCP and PIP joints">
  <image href="${HAND_IMG}" x="0" y="0" width="${W}" height="${H}"/>${m}</svg>
  <figcaption><span>Right hand</span><span>Back of hands · MCP 1–5 · PIP 1–5</span><span>Left hand</span></figcaption></figure>`;
}
function renderVisit(){
  const p=patients.find(x=>x.id===draft.patientId);
  let h=`<div class="row spread"><div><div class="eyebrow">Recording visit · <span class="num">${esc(p?.code)}</span></div><h1 style="font-size:22px">${STEPS[step]}</h1></div><button class="btn ghost" data-act="cancelVisit">Discard</button></div>
  <nav class="steps" aria-label="Visit sections">${STEPS.map((s,i)=>`<button data-step="${i}" ${i===step?'aria-current="step"':""} class="${i<step?"done":""}"><i>${i+1}</i>${s}</button>`).join("")}</nav>`;
  h+=`<section class="panel">`;
  if(step===0){
    h+=`<div class="grid2">
      <label class="f">Visit date<input id="v-date" type="date" value="${esc(draft.date)}"></label>
      <div class="f" style="font-size:13px;font-weight:600">Visit type<div class="seg" data-seg="type">${["In clinic","Telehealth","Nurse-led","Patient self-report"].map(o=>`<button aria-pressed="${draft.type===o}" data-val="${o}">${o}</button>`).join("")}</div></div>
    </div>
    <div class="f" style="font-size:13px;font-weight:600">Current RA treatment
      <div class="grid2" style="margin-top:6px">
        <label class="f"><span class="h">csDMARD(s)</span><input id="v-cs" type="text" value="${esc(draft.csdmard)}" placeholder="e.g. Methotrexate 20 mg weekly"></label>
        <label class="f"><span class="h">Biologic / targeted synthetic</span><input id="v-bts" type="text" value="${esc(draft.btsdmard)}" placeholder="e.g. none"></label>
        <label class="f"><span class="h">Oral glucocorticoid (mg/day prednisolone)</span><input id="v-gc" type="number" min="0" step="0.5" value="${esc(draft.gc)}" placeholder="0"></label>
      </div></div>
    <div class="f" style="font-size:13px;font-weight:600">Taking treatment as prescribed?<div class="seg" data-seg="adherence">${["Always","Mostly","Sometimes","Rarely"].map(o=>`<button aria-pressed="${draft.adherence===o}" data-val="${o}">${o}</button>`).join("")}</div></div>
    <label class="f">Side effects or safety concerns since last visit<textarea id="v-ae" placeholder="Infections, GI upset, abnormal bloods, none…">${esc(draft.ae)}</textarea></label>`;
  }
  if(step===1){
    h+=`<div class="jtool"><div class="mode" role="group" aria-label="Marking mode">
      <button data-m="t" aria-pressed="${jmode==="t"}">Tender</button><button data-m="s" aria-pressed="${jmode==="s"}">Swollen</button></div>
      <button class="btn ghost" data-act="clearJoints">Clear</button>
      <div class="jcounts"><span>TJC28 <b style="color:var(--tender)">${draft.tender.length}</b></span><span>SJC28 <b style="color:var(--swollen)">${draft.swollen.length}</b></span></div></div>
    <p class="note" style="margin:0">Choose Tender or Swollen, then tap each affected joint. The figures face you, so the patient's right is on your left. Tap a joint again to remove it.</p>
    <div class="jfig">${bodySVG()}${handSVG()}</div>
    <div class="legend"><span><i class="dot" style="border:3px solid var(--tender)"></i>Tender</span><span><i class="dot" style="background:var(--swollen)"></i>Swollen</span><span>28-joint count: shoulders, elbows, wrists, MCPs, PIPs, knees</span></div>`;
  }
  if(step===2){
    h+=nrs("v-ptga","Patient global assessment","very well","very poorly",draft.ptGA)
     +nrs("v-pain","Pain over the past week","no pain","worst imaginable",draft.pain)
     +nrs("v-fat","Fatigue","none","overwhelming",draft.fatigue)
     +`<div class="grid2"><label class="f">Morning stiffness (minutes)<input id="v-stiff" type="number" min="0" step="5" value="${esc(draft.stiff)}" placeholder="30"></label>
       <label class="f">HAQ-DI score<input id="v-haq" type="number" min="0" max="3" step="0.125" value="${esc(draft.haq)}" placeholder="0–3"><span class="h">From the HAQ questionnaire, if completed</span></label>
       <label class="f">Flares since last visit<input id="v-flares" type="number" min="0" value="${esc(draft.flares)}" placeholder="0"></label></div>
     <div class="f" style="font-size:13px;font-weight:600">What matters most to the patient right now?<div class="seg" data-seg="priorities" data-multi="1">${PRIORITIES.map(o=>`<button aria-pressed="${draft.priorities.includes(o)}" data-val="${o}">${o}</button>`).join("")}</div></div>
     <p class="note">Unmoved sliders are not recorded. Patient global is needed for DAS28 and CDAI.</p>`;
  }
  if(step===3){
    h+=nrs("v-evga","Evaluator global assessment","no activity","extremely active",draft.evGA)
     +`<div class="grid2"><label class="f">CRP (mg/L)<input id="v-crp" type="number" min="0" step="0.1" value="${esc(draft.crp)}" placeholder="e.g. 4"></label>
       <label class="f">ESR (mm/h)<input id="v-esr" type="number" min="1" step="1" value="${esc(draft.esr)}" placeholder="e.g. 18"></label></div>
     <p class="note">Enter whichever labs are available. Scores calculate as soon as their inputs are present.</p>`;
  }
  if(step===4){
    const sc=scores(draft), p2=patients.find(x=>x.id===draft.patientId), pr=primary(sc), met=targetMet(p2?.target,pr.cat);
    const box=(k,v,c)=>`<div class="score"><span class="k">${k}</span><span class="n">${f1(v)}</span>${v==null?'<span class="pill none">Missing inputs</span>':`<span class="pill ${c}">${CATNAME[c]}</span>`}</div>`;
    h+=`<div class="scores">${box("DAS28-CRP",sc.das28crp,cat("das28",sc.das28crp))}${box("DAS28-ESR",sc.das28esr,cat("das28",sc.das28esr))}${box("CDAI",sc.cdai,cat("cdai",sc.cdai))}${box("SDAI",sc.sdai,cat("sdai",sc.sdai))}</div>
    <div class="row">${met==null?`<span class="pill none">Target status needs a score</span>`:`<span class="pill ${met?"met":"miss"}">${met?"At agreed target":"Not at agreed target"} (${p2?.target==="lda"?"low activity":"remission"})</span>`}
    ${sc.boolean==null?"":`<span class="pill ${sc.boolean?"met":"none"}">ACR/EULAR Boolean remission: ${sc.boolean?"yes":"no"}</span>`}</div>
    <div class="f" style="font-size:13px;font-weight:600">Treatment decision<div class="seg" data-seg="decision">${DECISIONS.map(o=>`<button aria-pressed="${draft.decision===o}" data-val="${o}">${o}</button>`).join("")}</div></div>
    ${met===false&&draft.decision==="Continue current treatment"?`<label class="f">Reason for not adjusting treatment<input id="v-reason" type="text" value="${esc(draft.reason)}" placeholder="e.g. Recently started, comorbidity, patient preference"></label>`:""}
    <label class="chk"><input id="v-sdm" type="checkbox" ${draft.sdm?"checked":""}> Target and options were discussed and agreed with the patient</label>
    <div class="grid2"><label class="f">Next review<input id="v-next" type="date" value="${esc(draft.nextReview)}"><span class="h">T2T: every 1–3 months while active, 3–6 once target is held</span></label></div>
    <label class="f">Notes<textarea id="v-notes" placeholder="Anything else to record">${esc(draft.notes)}</textarea></label>`;
  }
  h+=`</section><div class="row spread">${step>0?`<button class="btn" data-act="prev">Back</button>`:"<span></span>"}${step<4?`<button class="btn primary" data-act="next">Next: ${STEPS[step+1]}</button>`:`<button class="btn primary" data-act="saveVisit" ${canWrite?"":"disabled"}>Save visit</button>`}</div>`;
  return h;
}
function renderDock(){
  const sc=scores(draft), pr=primary(sc);
  $("#dockIn").innerHTML=`<div class="live"><span>TJC <b>${sc.tjc}</b></span><span>SJC <b>${sc.sjc}</b></span><span>DAS28-CRP <b>${f1(sc.das28crp)}</b></span><span>CDAI <b>${f1(sc.cdai)}</b></span>${pr.val!=null?`<span class="pill ${pr.cat}">${CATNAME[pr.cat]}</span>`:""}</div>`;
}

function renderRecords(){
  const rows=visits.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let h=`<div class="row spread"><div><div class="eyebrow">Background record</div><h1 style="font-size:26px">All visits</h1><div class="muted" style="font-size:13px"><span class="num">${patients.length}</span> patients · <span class="num">${visits.length}</span> visits</div></div>
  <div class="row"><button class="btn" data-act="export" data-fmt="csv">Export CSV</button><button class="btn" data-act="export" data-fmt="json">Export JSON</button></div></div>`;
  if(!rows.length) return h+`<div class="empty">Visits appear here as they are saved. Every field is kept, so the whole dataset can be exported for audit or analysis.</div>`;
  const pc=id=>patients.find(p=>p.id===id)?.code||"?";
  h+=`<div class="tablewrap"><table class="recs"><thead><tr><th>Date</th><th>Patient</th><th>Type</th><th>TJC</th><th>SJC</th><th>PtGA</th><th>CRP</th><th>DAS28-CRP</th><th>CDAI</th><th>Status</th><th>Decision</th></tr></thead><tbody>`;
  rows.forEach(v=>{const pr=primary(v.scores||{});
    h+=`<tr><td class="num">${esc(v.date)}</td><td class="num">${esc(pc(v.patientId))}</td><td>${esc(v.type)}</td><td class="n">${v.scores?.tjc??""}</td><td class="n">${v.scores?.sjc??""}</td><td class="n">${v.ptGA??""}</td><td class="n">${v.crp??""}</td><td class="n">${f1(v.scores?.das28crp)}</td><td class="n">${f1(v.scores?.cdai)}</td><td><span class="pill ${pr.cat}">${CATNAME[pr.cat]}</span></td><td>${esc(v.decision||"")}</td></tr>`;});
  return h+`</tbody></table></div><p class="note">Exports include every captured field: joint-level tender/swollen sites, PROs, labs, all four composite scores, treatment, adherence, safety notes, patient priorities and next review.</p>`;
}

// ---------- Draft handling ----------
function newDraft(pid){
  const lv=latestVisit(pid);
  return {patientId:pid,date:today(),type:"In clinic",csdmard:lv?.csdmard||"",btsdmard:lv?.btsdmard||"",gc:lv?.gc??"",adherence:"",ae:"",
    tender:[],swollen:[],ptGA:null,pain:null,fatigue:null,stiff:"",haq:"",flares:"",priorities:[],evGA:null,crp:"",esr:"",
    decision:"",reason:"",sdm:false,nextReview:"",notes:""};
}
function readInputs(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
  const map={"v-date":"date","v-cs":"csdmard","v-bts":"btsdmard","v-gc":"gc","v-ae":"ae","v-stiff":"stiff","v-haq":"haq","v-flares":"flares","v-crp":"crp","v-esr":"esr","v-reason":"reason","v-next":"nextReview","v-notes":"notes"};
  for(const k in map){const v=g(k); if(v!==undefined) draft[map[k]]=v;}
  const s=document.getElementById("v-sdm"); if(s) draft.sdm=s.checked;
}
function suggestNext(){
  if(draft.nextReview) return;
  const pr=primary(scores(draft)), p=patients.find(x=>x.id===draft.patientId), met=targetMet(p?.target,pr.cat);
  if(met!=null) draft.nextReview=addMonths(draft.date||today(),met?6:3);
}

// ---------- Events ----------
function bind(){
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b));
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{readInputs();step=+b.dataset.step;if(step===4)suggestNext();render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-seg]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    readInputs(); const key=g.dataset.seg, val=b.dataset.val;
    if(g.dataset.multi){const a=draft[key];const i=a.indexOf(val);i>=0?a.splice(i,1):a.push(val);}
    else draft[key]=draft[key]===val?"":val;
    render();}));
  document.querySelectorAll("[data-nrs]").forEach(r=>r.oninput=()=>{
    const key={"v-ptga":"ptGA","v-pain":"pain","v-fat":"fatigue","v-evga":"evGA"}[r.id];
    draft[key]=+r.value; document.getElementById(r.id+"-v").textContent=r.value; renderDock();});
  document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{jmode=b.dataset.m;render()});
  document.querySelectorAll(".jt").forEach(j=>{
    const tog=()=>{const arr=jmode==="t"?draft.tender:draft.swollen;const i=arr.indexOf(j.dataset.joint);i>=0?arr.splice(i,1):arr.push(j.dataset.joint);render();
      const again=document.querySelector(`.jt[data-joint="${j.dataset.joint}"]`); again&&again.focus();};
    j.onclick=tog; j.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog();}};});
  ["v-crp","v-esr"].forEach(id=>{const e=document.getElementById(id); if(e) e.oninput=()=>{readInputs();renderDock();};});
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{if(view.name==="visit"&&!confirmLeave())return;view={name:b.dataset.view};render()});
}
function confirmLeave(){ toast("Save or discard the visit first"); return false; }

async function act(a,el){
  if(a==="home"){view={name:"patients"};render();}
  if(a==="newPatient"){view={name:"newPatient"};render();}
  if(a==="openPatient"){view={name:"patient",id:el.dataset.id};render();window.scrollTo(0,0);}
  if(a==="newVisit"){draft=newDraft(el.dataset.id);step=0;view={name:"visit"};render();window.scrollTo(0,0);}
  if(a==="cancelVisit"){const pid=draft.patientId;draft=null;view={name:"patient",id:pid};render();}
  if(a==="next"){readInputs();step++;if(step===4)suggestNext();render();window.scrollTo(0,0);}
  if(a==="prev"){readInputs();step--;render();window.scrollTo(0,0);}
  if(a==="clearJoints"){draft.tender=[];draft.swollen=[];render();}
  if(a==="savePatient"){
    const code=$("#np-code").value.trim();
    if(!code){toast("Enter a study code");return;}
    if(patients.some(p=>p.code.toLowerCase()===code.toLowerCase())){toast("That code is already in use");return;}
    const rec={code,yob:$("#np-yob").value?+$("#np-yob").value:null,sex:$("#np-sex").value,dxYear:$("#np-dx").value?+$("#np-dx").value:null,
      rf:$("#np-rf").value,acpa:$("#np-acpa").value,target:$("#np-target").value,createdAt:new Date().toISOString()};
    const id="p_"+code.replace(/[^A-Za-z0-9_-]/g,"-")+"_"+Math.random().toString(36).slice(2,6);
    await write("patients/"+id,rec,()=>{patients.push({id,...rec});});
    view={name:"patient",id};render();toast("Patient added");
  }
  if(a==="saveVisit"){
    readInputs();
    const sc=scores(draft);
    const rec={...draft,crp:n(draft.crp),esr:n(draft.esr),gc:n(draft.gc),stiff:n(draft.stiff),haq:n(draft.haq),flares:n(draft.flares),
      scores:Object.fromEntries(Object.entries(sc).map(([k,v])=>[k,typeof v==="number"?Math.round(v*100)/100:v])),
      category:primary(sc).cat,targetMet:targetMet(patients.find(p=>p.id===draft.patientId)?.target,primary(sc).cat),savedAt:new Date().toISOString()};
    const id="v_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const ok=await write("visits/"+id,rec,()=>{visits.push({id,...rec});});
    if(ok){const pid=draft.patientId;draft=null;view={name:"patient",id:pid};render();toast("Visit saved");window.scrollTo(0,0);}
  }
  if(a==="export") exportData(el.dataset.fmt);
}

async function write(path,rec,localFn){
  if(!live){localFn(); if(localMode){ if(!lsSave()) toast("Couldn't save in this browser. Export your records now."); } else toast("Not saved: storage unavailable in this view"); render(); return true;}
  try{await db.doc(path).set(rec);return true;}
  catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;toast("You don't have permission to save records");render();}
    else if(e&&e.code==="quota_exceeded") toast("The record store is full. Export and archive older visits.");
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  }
}

function csvCell(v){if(v==null)return"";const s=Array.isArray(v)?v.join("; "):String(v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function exportData(fmt){
  const pc=id=>patients.find(p=>p.id===id)||{};
  let data,name;
  if(fmt==="json"){data=JSON.stringify({exportedAt:new Date().toISOString(),patients,visits},null,2);name="everest-prototype-records.json";}
  else{
    const cols=["date","patient_code","target","type","tjc28","sjc28","tender_joints","swollen_joints","pt_global","pain","fatigue","morning_stiffness_min","haq_di","flares","ev_global","crp_mg_l","esr_mm_h","das28_crp","das28_esr","cdai","sdai","boolean_remission","category","target_met","csdmard","bts_dmard","glucocorticoid_mg","adherence","safety_notes","priorities","decision","reason_no_change","sdm_agreed","next_review","notes"];
    const rows=visits.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(v=>{const p=pc(v.patientId),s=v.scores||{};
      return [v.date,p.code,p.target,v.type,s.tjc,s.sjc,v.tender,v.swollen,v.ptGA,v.pain,v.fatigue,v.stiff,v.haq,v.flares,v.evGA,v.crp,v.esr,s.das28crp,s.das28esr,s.cdai,s.sdai,s.boolean,v.category,v.targetMet,v.csdmard,v.btsdmard,v.gc,v.adherence,v.ae,v.priorities,v.decision,v.reason,v.sdm,v.nextReview,v.notes].map(csvCell).join(",");});
    data=[cols.join(","),...rows].join("\n");name="everest-prototype-visits.csv";
  }
  if(!downloads){ try{const blob=new Blob([data],{type:fmt==="json"?"application/json":"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Export downloaded");}catch(e){toast("Export isn't available in this browser")} return;}
  try{await downloads.save({filename:name,data});toast("Export ready");}
  catch(e){if(e?.code!=="declined")toast("Export isn't available in this view");}
}

// ---------- Boot ----------
render();
(async()=>{
  try{downloads=await window.claude?.use?.("downloads");}catch(e){}
})();
(async()=>{
  try{db=await window.claude?.use?.("db");}catch(e){db=null}
  if(!db){ localMode=true; const saved=lsLoad(); if(saved){patients=saved.patients||[];visits=saved.visits||[];} else {patients=SEED.patients.slice();visits=SEED.visits.slice();lsSave();} setStatus("local"); return; }
  live=true;
  try{const u=await window.claude.use("user"); const c=u?await u.can("data.write"):null; if(c===false)canWrite=false;}catch(e){}
  let gotP=false,gotV=false;
  const timer=setTimeout(()=>{if(!(gotP&&gotV))setStatus("slow")},10000);
  const done=()=>{if(gotP&&gotV){clearTimeout(timer);setStatus("ready");}};
  db.collection("patients").onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)gotP=true;if(view.name!=="visit"&&view.name!=="newPatient")render();done();},
    ()=>{clearTimeout(timer);setStatus("offline");live=false;});
  db.collection("visits").onSnapshot(s=>{visits=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)gotV=true;if(view.name!=="visit"&&view.name!=="newPatient")render();done();},
    ()=>{clearTimeout(timer);setStatus("offline");live=false;});
})();
})();
</script>

</body>
</html>
